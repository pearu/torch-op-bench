# The `torch` environment on a host without a torch build: a PyTorch nightly wheel.
# Create it with `scripts/setup-env.sh torch-nightly` (prefix envs/.prefix/torch-nightly)
# and run torch-op-bench from its interpreter: the runner's own interpreter is the
# `torch` environment, so no `--env torch=...` is needed. envs/torch-stable.yml is the
# PyPI release instead. Every version is pinned: a results file names this
# definition, and a definition that drifts would make the record lie. To move to a
# newer nightly, replace the version, its triton and the date below.
name: torch
channels:
  - conda-forge
dependencies:
  # As the other definitions: the newest Python minor with wheels of everything below.
  - python=3.14.8
  - pip=26.2.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/nightly/cu130
      # The newest nightly on 2026-10-17, CUDA 13.0. torch main carries the CuTeDSL
      # LCE override (torch/_native/ops/linear_cross_entropy/).
      - torch==2.16.0.dev20261017+cu130
      # The triton this nightly requires, from the same index.
      - triton==3.9.0+gitfc8d31a5
      # The override's runtime, the versions pytorch-dev has; torch._native checks
      # both before registering the override, registers it, and does not run it on
      # CPU or below sm_80.
      - nvidia-cutlass-dsl==4.8.0
      - apache-tvm-ffi==0.1.12
      # torch imports numpy if it is there and warns in every worker when not
      # ("Failed to initialize NumPy", in each record's stderr): the newest.
      - numpy==2.5.4
