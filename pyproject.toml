[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-op-bench"
version = "0.1.0.dev0"
description = "Benchmark torch ops and their counterparts: throughput, peak memory and parity"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Pearu Peterson" }]
requires-python = ">=3.10"
# torch is taken from the environment under test and is deliberately not declared.
dependencies = []

[project.optional-dependencies]
# matplotlib only: the reports read records with the standard library, no pandas.
plot = ["matplotlib"]
dev = ["pytest", "pytest-cov", "pytest-testmon>=2.2", "ruff"]
# Liger in the torch environment itself (§4.2); envs/liger.yml is its own environment.
liger = ["liger-kernel==0.8.4"]
# torchtitan in the torch environment itself (§4.2); envs/torchtitan.yml is its own.
torchtitan = ["torchtitan==0.3.0"]

[project.scripts]
torch-op-bench = "torch_op_bench.cli:main"

[project.urls]
Repository = "https://github.com/pearu/torch-op-bench"

[tool.setuptools.packages.find]
include = ["torch_op_bench*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: needs a CUDA device; skipped without one"]
